<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Records - Value Vision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='previous.css') }}">
</head>
<body>
    <div class="container">
        <h2>Your Previous Records</h2>
        <table>
            <tr>
                <th>Date</th>
                <th>Age</th>
                <th>Height (cm)</th>
                <th>Weight (kg)</th>
                <th>Maintenance Calories</th>
            </tr>
            {% for record in records %}
            <tr>
                <td>{{ record['date'] }}</td>
                <td>{{ record['age'] }}</td>
                <td>{{ record['height'] }}</td>
                <td>{{ record['weight'] }}</td>
                <td>{{ record['maintenance_calories'] }}</td>
            </tr>
            {% endfor %}
        </table>
        <a href="{{ url_for('main') }}" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
